name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Frontend install
        run: npm ci

      - name: Frontend lint & build
        working-directory: apps/frontend
        run: |
          if [ -f package.json ]; then npm run lint --if-present && npm run build --if-present; fi

      - name: Backend build
        working-directory: apps/backend
        run: mvn -q -DskipTests package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${EC2_PORT:-22}" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository to EC2
        run: |
          set -euo pipefail
          ssh -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_APP_DIR'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.env.production.local' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'target/' \
            --exclude '.angular/' \
            --exclude '.cache/' \
            -e "ssh -p ${EC2_PORT:-22}" \
            ./ "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/"

      - name: Deploy on EC2
        run: |
          set -euo pipefail
          ssh -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" "cd '$EC2_APP_DIR' && bash scripts/deploy-ec2.sh"
