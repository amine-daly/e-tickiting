name: CI

on:
  push:
    branches: [sandbox]
    paths:
      - "apps/frontend/**" # Only triggers if frontend changes
      - "apps/terminal/**" # Only triggers if backoffice changes
      - "apps/backend/**" # Only triggers if backend changes
      - "libs/**" # Shared helpers used by the backoffice build
      - "infra/**" # Docker and deploy assets
      - ".github/**" # Workflow changes themselves
  pull_request:
    branches: [sandbox]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      terminal: ${{ steps.filter.outputs.terminal }}
      backend: ${{ steps.filter.outputs.backend }}
      libs: ${{ steps.filter.outputs.libs }}
      infra: ${{ steps.filter.outputs.infra }}
      github: ${{ steps.filter.outputs.github }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "apps/frontend/**"
            terminal:
              - "apps/terminal/**"
            backend:
              - "apps/backend/**"
            libs:
              - "libs/**"
            infra:
              - "infra/**"
            github:
              - ".github/**"
            deploy:
              - "apps/frontend/**"
              - "apps/terminal/**"
              - "apps/backend/**"
              - "libs/**"
              - "infra/**"
              - ".github/**"

  build-backoffice:
    needs: filter
    if: needs.filter.outputs.terminal == 'true' || needs.filter.outputs.libs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/terminal/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Backoffice install
        working-directory: apps/terminal
        run: npm ci

      - name: Backoffice lint & build
        working-directory: apps/terminal
        run: |
          if [ -f package.json ]; then npm run lint --if-present && npm run build --if-present; fi

  build-frontend:
    needs: filter
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Frontoffice install
        working-directory: apps/frontend
        run: npm ci

      - name: Frontoffice lint & build
        working-directory: apps/frontend
        run: |
          if [ -f package.json ]; then npm run lint --if-present && npm run build --if-present; fi

  build-backend:
    needs: filter
    if: needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Backend build
        working-directory: apps/backend
        run: mvn -q -DskipTests package

  deploy:
    runs-on: ubuntu-latest
    needs: [filter, build-backoffice, build-frontend, build-backend]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/sandbox' &&
      needs.filter.outputs.deploy == 'true' &&
      (needs.build-backoffice.result == 'success' || needs.build-backoffice.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped')
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
      MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
      FRONTEND_HOST_PORT: ${{ secrets.FRONTEND_HOST_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${EC2_PORT:-22}" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository to EC2
        run: |
          set -euo pipefail
          ssh_opts=(-p "${EC2_PORT:-22}" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_APP_DIR'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.env.production.local' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'target/' \
            --exclude '.angular/' \
            --exclude '.cache/' \
            -e "ssh -p ${EC2_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30" \
            ./ "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/"

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          missing=()
          for name in MONGO_INITDB_ROOT_USERNAME MONGO_INITDB_ROOT_PASSWORD JWT_SECRET; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}" >&2
            exit 1
          fi

          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${AWS_REGION:-}" ] || [ -z "${AWS_S3_BUCKET:-}" ]; then
            echo "AWS S3 secrets are optional in this deploy flow. Uploads require them or an EC2 IAM role." >&2
          fi

      - name: Upload production env to EC2
        run: |
          set -euo pipefail
          scp_opts=(-P "${EC2_PORT:-22}" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          ssh_opts=(-p "${EC2_PORT:-22}" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          env_file="$RUNNER_TEMP/eticketing.env"
          umask 077
          ENV_OUT="$env_file" python - <<'PY'
          import os
          from urllib.parse import quote
          from pathlib import Path

          env_path = Path(os.environ["ENV_OUT"])
          values = {
              "MONGO_INITDB_ROOT_USERNAME": os.environ.get("MONGO_INITDB_ROOT_USERNAME", ""),
              "MONGO_INITDB_ROOT_PASSWORD": os.environ.get("MONGO_INITDB_ROOT_PASSWORD", ""),
              "MONGO_DB_NAME": os.environ.get("MONGO_DB_NAME") or "eticketing",
              "JWT_SECRET": os.environ.get("JWT_SECRET", ""),
              "SPRING_PROFILES_ACTIVE": os.environ.get("SPRING_PROFILES_ACTIVE") or "prod",
              "FRONTEND_HOST_PORT": os.environ.get("FRONTEND_HOST_PORT") or "80",
          }

            optional_values = {
              "AWS_ACCESS_KEY_ID": os.environ.get("AWS_ACCESS_KEY_ID", ""),
              "AWS_SECRET_ACCESS_KEY": os.environ.get("AWS_SECRET_ACCESS_KEY", ""),
              "AWS_SESSION_TOKEN": os.environ.get("AWS_SESSION_TOKEN", ""),
              "AWS_REGION": os.environ.get("AWS_REGION", ""),
              "AWS_S3_BUCKET": os.environ.get("AWS_S3_BUCKET", ""),
            }

            for key, value in optional_values.items():
              if value:
                values[key] = value

          user = values["MONGO_INITDB_ROOT_USERNAME"]
          password = values["MONGO_INITDB_ROOT_PASSWORD"]
          db_name = values["MONGO_DB_NAME"]
          values["MONGODB_URI"] = (
              "mongodb://"
              f"{quote(user, safe='')}:{quote(password, safe='')}"
              f"@mongo:27017/{quote(db_name, safe='')}?authSource=admin"
          )

          for key, value in values.items():
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"{key} contains a newline; .env values must be single-line.")

          env_path.write_text(
              "\n".join(f"{key}={value}" for key, value in values.items()) + "\n",
              encoding="utf-8",
          )
          PY
          scp "${scp_opts[@]}" "$env_file" "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/.env"
          ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" "chmod 600 '$EC2_APP_DIR/.env'"

      - name: Deploy on EC2
        run: |
          set -euo pipefail
          ssh_opts=(-p "${EC2_PORT:-22}" -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          remote_dir="$EC2_APP_DIR"

          ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" "cd '$remote_dir' && rm -f .deploy.log .deploy.exit .deploy.pid && nohup sh -c 'bash scripts/deploy-ec2.sh > .deploy.log 2>&1; printf \"%s\" \$? > .deploy.exit' >/dev/null 2>&1 & echo \$! > .deploy.pid"

          printed_lines=0
          for _ in $(seq 1 240); do
            start_line=$((printed_lines + 1))
            new_output="$(ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" "cd '$remote_dir' && if [ -f .deploy.log ]; then sed -n '${start_line},\$p' .deploy.log; fi")"

            if [ -n "$new_output" ]; then
              printf '%s\n' "$new_output"
              printed_lines=$((printed_lines + $(printf '%s\n' "$new_output" | wc -l | tr -d ' ')))
            fi

            status="$(ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" "cd '$remote_dir' && if [ -f .deploy.exit ]; then cat .deploy.exit; else echo RUNNING; fi" | tr -d '\r\n')"
            if [ "$status" != "RUNNING" ]; then
              if [ "$status" -ne 0 ]; then
                echo "Remote deploy failed with exit code $status." >&2
                exit "$status"
              fi
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for remote deploy to finish." >&2
          exit 1
