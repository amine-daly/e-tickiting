name: CI

on:
  push:
    branches: [sandbox]
    paths:
      - "apps/frontend/**" # Only triggers if frontend changes
      - "apps/terminal/**" # Only triggers if backoffice changes
      - "apps/backend/**" # Only triggers if backend changes
      - "libs/**" # Shared helpers used by the backoffice build
      - "infra/**" # Docker and deploy assets
      - ".github/**" # Workflow changes themselves
  pull_request:
    branches: [sandbox]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('apps/terminal/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Backoffice install
        working-directory: apps/terminal
        run: npm ci

      - name: Backoffice lint & build
        working-directory: apps/terminal
        run: |
          if [ -f package.json ]; then npm run lint --if-present && npm run build --if-present; fi

      - name: Backend build
        working-directory: apps/backend
        run: mvn -q -DskipTests package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/sandbox'
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
      MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
      FRONTEND_HOST_PORT: ${{ secrets.FRONTEND_HOST_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${EC2_PORT:-22}" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository to EC2
        run: |
          set -euo pipefail
          ssh -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_APP_DIR'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude '.env.production.local' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'target/' \
            --exclude '.angular/' \
            --exclude '.cache/' \
            -e "ssh -p ${EC2_PORT:-22}" \
            ./ "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/"

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          missing=()
          for name in MONGO_INITDB_ROOT_USERNAME MONGO_INITDB_ROOT_PASSWORD JWT_SECRET; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Upload production env to EC2
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/eticketing.env"
          umask 077
          escape() {
            # Escape single quotes for safe single-quoted shell assignment
            sed "s/'/'\"'\"'/g" <<< "$1"
          }
          {
            echo "MONGO_INITDB_ROOT_USERNAME='$(escape "$MONGO_INITDB_ROOT_USERNAME")'"
            echo "MONGO_INITDB_ROOT_PASSWORD='$(escape "$MONGO_INITDB_ROOT_PASSWORD")'"
            echo "MONGO_DB_NAME='$(escape "${MONGO_DB_NAME:-eticketing}")'"
            echo "JWT_SECRET='$(escape "$JWT_SECRET")'"
            echo "SPRING_PROFILES_ACTIVE='$(escape "${SPRING_PROFILES_ACTIVE:-prod}")'"
            echo "FRONTEND_HOST_PORT='$(escape "${FRONTEND_HOST_PORT:-80}")'"
          } > "$env_file"
          scp -P "${EC2_PORT:-22}" "$env_file" "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/.env"
          ssh -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" "chmod 600 '$EC2_APP_DIR/.env'"

      - name: Deploy on EC2
        run: |
          set -euo pipefail
          ssh -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" "cd '$EC2_APP_DIR' && bash scripts/deploy-ec2.sh"
