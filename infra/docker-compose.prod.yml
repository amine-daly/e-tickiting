services:
  mongo:
    image: mongo:7
    container_name: eticketing-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-eticketing}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ../
      dockerfile: infra/docker/backend.Dockerfile
    container_name: eticketing-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MONGODB_URI: ${MONGODB_URI}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mongo

volumes:
  mongo_data:
  uploads_data:
