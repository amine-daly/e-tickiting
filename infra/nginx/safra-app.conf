# Host-level Nginx for DuckDNS frontends (same EC2 instance)
# Install: sudo cp infra/nginx/safra-app.conf /etc/nginx/sites-available/safra-app
#          sudo ln -sf /etc/nginx/sites-available/safra-app /etc/nginx/sites-enabled/safra-app
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
#
# SSL bootstrap for safra-express (run once on EC2, after DuckDNS points to this server):
#   sudo certbot --nginx -d safra-express.duckdns.org
# safra-app.duckdns.org should already have a cert from the previous setup.

server {
    listen 80;
    listen [::]:80;
    server_name safra-express.duckdns.org safra-app.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontoffice — safra-express.duckdns.org
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name safra-express.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/safra-express.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safra-express.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    root /var/www/safra-frontoffice;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Backoffice Terminal — safra-app.duckdns.org
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name safra-app.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/safra-app.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safra-app.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

