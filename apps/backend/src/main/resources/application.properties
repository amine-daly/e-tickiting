spring.application.name=eticketing-backend
server.port=${BACKEND_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/eticketing}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.security=INFO

# Multipart upload limits (for image/file uploads)
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# AWS S3 configuration (values sourced from environment variables, no hardcoding)
aws.s3.region=${AWS_REGION:eu-north-1}
aws.s3.bucket=${AWS_S3_BUCKET:eticketing-app}

# Storage mode: s3 (default), auto, or local
storage.mode=${STORAGE_MODE:s3}
storage.local.dir=${STORAGE_LOCAL_DIR:/app/uploads}
storage.local.base-url=${STORAGE_LOCAL_BASE_URL:/api/files/raw}

# Ensure LocalDate is serialized as a string, not an array
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Outbound mail (configure via environment variables when enabling ticket emails)
