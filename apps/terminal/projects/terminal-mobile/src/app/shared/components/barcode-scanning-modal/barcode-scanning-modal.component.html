<ion-header>
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="scan-instructions">
    <div class="scan-title">Point at the ticket QR code</div>
    <div class="scan-subtitle">Align the code inside the white frame</div>
  </div>

  <div #square class="square"></div>
  <video #video class="video" hidden playsinline></video>

  <ion-fab
    *ngIf="isTorchAvailable"
    slot="fixed"
    horizontal="end"
    vertical="bottom"
  >
    <ion-fab-button (click)="toggleTorch()" [class.torch-on]="torchEnabled">
      <ion-icon name="flashlight"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
