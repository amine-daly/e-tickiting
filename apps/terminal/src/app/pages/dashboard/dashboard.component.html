<!-- begin::Actions Dropdown -->
<div *ngIf="isAdmin" class="d-flex justify-content-end mb-5">
  <div ngbDropdown placement="bottom-right">
    <button class="btn btn-sm btn-primary" ngbDropdownToggle>
      <i class="ki-duotone ki-setting-2 fs-4 me-1">
        <span class="path1"></span>
        <span class="path2"></span>
      </i>
      {{ "DASHBOARD.ACTIONS.TITLE" | translate }}
    </button>
    <div
      ngbDropdownMenu
      class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-200px py-4"
    >
      <div class="menu-item px-3">
        <a class="menu-link px-3 cursor-pointer" (click)="openAddPosModal()">
          <i class="ki-duotone ki-plus-square fs-4 me-2 text-primary">
            <span class="path1"></span>
            <span class="path2"></span>
            <span class="path3"></span>
          </i>
          {{ "DASHBOARD.ACTIONS.ADD_CUSTOMER" | translate }}
        </a>
      </div>
      <div class="menu-item px-3">
        <a class="menu-link px-3 cursor-pointer" (click)="openDeletePosModal()">
          <i class="ki-duotone ki-trash fs-4 me-2 text-danger">
            <span class="path1"></span>
            <span class="path2"></span>
            <span class="path3"></span>
            <span class="path4"></span>
            <span class="path5"></span>
          </i>
          {{ "DASHBOARD.ACTIONS.DELETE_CUSTOMER" | translate }}
        </a>
      </div>
      <div class="separator my-2"></div>
      <div class="menu-item px-3">
        <a
          class="menu-link px-3 cursor-pointer"
          (click)="openAssignCustomerModal()"
        >
          <i class="ki-duotone ki-user-tick fs-4 me-2 text-success">
            <span class="path1"></span>
            <span class="path2"></span>
            <span class="path3"></span>
          </i>
          {{ "DASHBOARD.ACTIONS.ASSIGN_CUSTOMER" | translate }}
        </a>
      </div>
    </div>
  </div>
</div>
<!-- end::Actions Dropdown -->
