<div class="modal-header">
  <h2 class="modal-title">{{ "DASHBOARD.POS.DELETE_TITLE" | translate }}</h2>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="dismiss()"
  ></button>
</div>

<div class="modal-body p-0">
  <!--begin::Loading-->
  <div *ngIf="isLoading" class="d-flex justify-content-center py-10">
    <span class="spinner-border spinner-border-sm text-primary"></span>
  </div>
  <!--end::Loading-->

  <!--begin::Empty State-->
  <div
    *ngIf="!isLoading && !accountTargets.length"
    class="text-center py-10 text-muted"
  >
    {{ "DASHBOARD.POS.NO_CUSTOMERS" | translate }}
  </div>
  <!--end::Empty State-->

  <!--begin::Company List-->
  <div *ngIf="!isLoading && accountTargets.length" class="mh-400px scroll-y">
    <div
      *ngFor="let account of accountTargets"
      class="d-flex align-items-center justify-content-between px-5 py-4 border-bottom border-gray-200"
    >
      <!--begin::Company Info-->
      <div class="d-flex align-items-center">
        <div class="symbol symbol-40px symbol-circle me-4">
          <img
            *ngIf="
              getCompany(account)?.picture?.baseUrl &&
              getCompany(account)?.picture?.path
            "
            [src]="
              getCompany(account)?.picture?.baseUrl +
              '/' +
              getCompany(account)?.picture?.path
            "
            alt="Company"
          />
          <span
            *ngIf="
              !getCompany(account)?.picture?.baseUrl ||
              !getCompany(account)?.picture?.path
            "
            class="symbol-label bg-light-primary text-primary fw-bold fs-6"
          >
            {{ getCompany(account)?.name?.charAt(0) | uppercase }}
          </span>
        </div>
        <div>
          <div class="fw-bold text-gray-800">
            {{ getCompany(account)?.name }}
          </div>
          <div *ngIf="getCompany(account)?.legalName" class="text-muted small">
            {{ getCompany(account)?.legalName }}
          </div>
        </div>
      </div>
      <!--end::Company Info-->

      <!--begin::Delete Button-->
      <button
        type="button"
        class="btn btn-icon btn-sm btn-light-danger"
        [disabled]="deletingId === account?.id || accountTargets?.length === 1"
        (click)="deleteAssignment(account)"
      >
        <span *ngIf="deletingId !== account?.id">
          <i class="ki-duotone ki-trash fs-4">
            <span class="path1"></span>
            <span class="path2"></span>
            <span class="path3"></span>
            <span class="path4"></span>
            <span class="path5"></span>
          </i>
        </span>
        <span
          *ngIf="deletingId === account?.id"
          class="spinner-border spinner-border-sm"
        ></span>
      </button>
      <!--end::Delete Button-->
    </div>
  </div>
  <!--end::Company List-->
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-light" (click)="dismiss()">
    {{ "COMMON.BUTTON.CLOSE" | translate }}
  </button>
</div>
