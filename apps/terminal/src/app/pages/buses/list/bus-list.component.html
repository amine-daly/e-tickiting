<app-toolbar [appToolbarLayout]="'classic'">
  <div toolbar-actions>
    <button class="btn btn-sm fw-bold btn-primary" routerLink="/buses/create">
      <i class="ki-duotone ki-plus fs-2"></i>
      {{ "BUSES.ADD_BUTTON" | translate }}
    </button>
  </div>
</app-toolbar>

<div class="tab-pane fade show active">
  <ng-container *ngIf="buses$ | async as buses">
    <div class="row g-6 g-xl-9">
      <div *ngFor="let bus of buses" class="col-md-6 col-xxl-4">
        <!--begin::Card-->
        <div class="card">
          <!--begin::Card body-->
          <div class="card-body d-flex flex-center flex-column pt-12 p-9">
            <!--begin::Picture-->
            <div class="symbol symbol-65px symbol-circle mb-5">
              <img
                *ngIf="getPictureUrl(bus) as url; else noBusPicture"
                [src]="url"
                alt="bus"
                class="object-fit-cover"
              />
              <ng-template #noBusPicture>
                <span
                  class="symbol-label fs-2x fw-semibold text-primary bg-light-primary"
                >
                  <i class="ki-duotone ki-bus fs-2x">
                    <span class="path1"></span>
                    <span class="path2"></span>
                    <span class="path3"></span>
                    <span class="path4"></span>
                  </i>
                </span>
              </ng-template>
            </div>
            <!--end::Picture-->

            <!--begin::Name-->
            <a
              [routerLink]="['/buses', bus.id, 'edit']"
              class="fs-4 text-gray-800 text-hover-primary fw-bold mb-0"
            >
              {{ bus.name }}
            </a>
            <!--end::Name-->

            <!--begin::Seats badge-->
            <div class="fw-semibold text-gray-400 mt-1 mb-3">
              <span class="badge badge-light-info">
                {{ bus.totalSeats }} {{ "BUSES.LABEL.SEATS" | translate }}
              </span>
            </div>
            <!--end::Seats badge-->

            <!--begin::Amenities-->
            <div
              *ngIf="bus.amenities?.length"
              class="d-flex flex-wrap justify-content-center gap-2 mb-3"
            >
              <span
                *ngFor="let amenity of bus.amenities"
                class="badge badge-light-primary"
                [title]="'BUSES.AMENITY.' + amenity | translate"
              >
                <i [class]="amenityIcons[amenity] + ' fs-6 me-1'">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>
                {{ "BUSES.AMENITY." + amenity | translate }}
              </span>
            </div>
            <!--end::Amenities-->
          </div>
          <!--end::Card body-->

          <div class="card-footer p-3">
            <div class="d-flex justify-content-end flex-shrink-0">
              <button
                [routerLink]="['/buses', bus.id, 'edit']"
                class="btn btn-icon btn-active-light-primary w-30px h-30px me-3"
              >
                <i class="ki-duotone ki-pencil fs-2">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>
              </button>
              <button
                (click)="deleteBus(bus)"
                class="btn btn-icon btn-active-light-danger w-30px h-30px me-3"
              >
                <i class="ki-duotone ki-trash fs-2">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>
              </button>
            </div>
          </div>
        </div>
        <!--end::Card-->
      </div>
    </div>

    <!--begin::Empty state-->
    <div
      *ngIf="!buses?.length && (loading$ | async) === false"
      class="d-flex flex-column align-items-center justify-content-center py-10"
    >
      <i class="ki-duotone ki-bus fs-xl-2hx mb-6">
        <span class="path1"></span>
        <span class="path2"></span>
        <span class="path3"></span>
        <span class="path4"></span>
      </i>
      <div class="fw-bold fs-5 text-muted">
        {{ "BUSES.EMPTY" | translate }}
      </div>
    </div>
    <!--end::Empty state-->

    <app-pagination
      *ngIf="buses?.length"
      [page]="page"
      [pageSize]="pageSize"
      [total]="(pagination$ | async)?.length || 0"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </ng-container>
</div>
