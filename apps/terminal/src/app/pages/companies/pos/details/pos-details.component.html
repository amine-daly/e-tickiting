<app-toolbar [appToolbarLayout]="'classic'">
  <div toolbar-actions>
    <button
      class="btn btn-sm fw-bold btn-secondary me-3"
      [routerLink]="['/companies', companyId, 'pos']"
    >
      <i class="ki-duotone ki-arrow-left fs-2"></i>
      {{ "COMMON.BUTTON.BACK" | translate }}
    </button>
  </div>
</app-toolbar>

<div class="card">
  <div class="card-header">
    <h3 class="card-title">
      {{ (pos ? "POS.FORM.EDIT_TITLE" : "POS.FORM.CREATE_TITLE") | translate }}
    </h3>
  </div>

  <form [formGroup]="posForm" (ngSubmit)="submit()">
    <div class="card-body">
      <!--begin::Picture-->
      <h5 class="fw-bold mb-3">{{ "POS.LABEL.PICTURE" | translate }}</h5>
      <div class="row mb-6">
        <div class="col-md-12 fv-row mb-3">
          <div class="d-flex align-items-center gap-4 flex-wrap">
            <div
              (click)="uploadPicture()"
              class="symbol symbol-100px cursor-pointer"
              *ngIf="getPictureUrl() as pictureUrl; else noPicture"
            >
              <img [src]="pictureUrl" [alt]="'POS.LABEL.PICTURE' | translate" />
              <button
                type="button"
                class="btn btn-icon btn-light-danger btn-sm position-absolute top-0 end-0 m-1 w-25px h-25px"
                (click)="$event.stopPropagation(); removePicture()"
              >
                <i class="ki-duotone ki-cross fs-4">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>
              </button>
            </div>
            <ng-template #noPicture>
              <div
                (click)="uploadPicture()"
                class="symbol symbol-100px cursor-pointer"
              >
                <span
                  class="symbol-label fs-6 fw-bold bg-light-primary text-primary"
                >
                  <span *ngIf="!isUploadingPicture; else waitForUpload">
                    {{ "COMMON.BUTTON.UPLOAD" | translate }}
                  </span>
                  <ng-template #waitForUpload>
                    <span
                      class="spinner-border spinner-border-sm align-middle ms-2"
                    ></span>
                  </ng-template>
                </span>
              </div>
            </ng-template>
          </div>
        </div>
      </div>
      <!--end::Picture-->

      <!--begin::General Info-->
      <div class="row mb-6">
        <div class="col-md-6 fv-row mb-3">
          <label class="required fs-6 fw-semibold mb-2">
            {{ "POS.LABEL.TITLE" | translate }}
          </label>
          <input
            type="text"
            class="form-control form-control-solid"
            formControlName="title"
            [class.is-invalid]="isInvalid('title')"
          />
          <div *ngIf="isInvalid('title')" class="invalid-feedback">
            {{ "COMMON.VALIDATION.REQUIRED" | translate }}
          </div>
        </div>

        <div class="col-md-6 fv-row mb-3">
          <label class="fs-6 fw-semibold mb-2">
            {{ "POS.LABEL.SUBTITLE" | translate }}
          </label>
          <input
            type="text"
            class="form-control form-control-solid"
            formControlName="subtitle"
          />
        </div>

        <div class="col-md-6 fv-row mb-3">
          <label class="fs-6 fw-semibold mb-2">
            {{ "POS.LABEL.EMAIL" | translate }}
          </label>
          <input
            type="email"
            class="form-control form-control-solid"
            formControlName="email"
            [class.is-invalid]="isInvalid('email')"
          />
        </div>
      </div>
      <!--end::General Info-->

      <!--begin::Phone-->
      <h5 class="fw-bold mb-3">{{ "POS.LABEL.PHONE" | translate }}</h5>
      <div class="row mb-6" formGroupName="phone">
        <div class="col-md-3 fv-row mb-3">
          <label class="fs-6 fw-semibold mb-2">{{
            "POS.LABEL.COUNTRY_CODE" | translate
          }}</label>
          <input
            type="text"
            class="form-control form-control-solid"
            formControlName="countryCode"
          />
        </div>
        <div class="col-md-9 fv-row mb-3">
          <label class="fs-6 fw-semibold mb-2">{{
            "POS.LABEL.NUMBER" | translate
          }}</label>
          <input
            type="text"
            class="form-control form-control-solid"
            formControlName="number"
          />
        </div>
      </div>
      <!--end::Phone-->

      <!--begin::Location-->
      <h5 class="fw-bold mb-3">{{ "POS.LABEL.LOCATION" | translate }}</h5>
      <div class="row mb-6" formGroupName="location">
        <div class="col-md-6 fv-row mb-3">
          <label class="fs-6 fw-semibold mb-2">{{
            "COMMON.LABEL.ADDRESS" | translate
          }}</label>
          <input
            type="text"
            class="form-control form-control-solid"
            formControlName="addressLine"
          />
        </div>
        <div class="col-md-3 fv-row mb-3">
          <label class="fs-6 fw-semibold mb-2">{{
            "COMMON.LABEL.CITY" | translate
          }}</label>
          <input
            type="text"
            class="form-control form-control-solid"
            formControlName="city"
          />
        </div>
        <div class="col-md-3 fv-row mb-3">
          <label class="fs-6 fw-semibold mb-2">{{
            "POS.LABEL.ZIP_CODE" | translate
          }}</label>
          <input
            type="text"
            class="form-control form-control-solid"
            formControlName="zipCode"
          />
        </div>
      </div>
      <!--end::Location-->
    </div>

    <div class="card-footer d-flex justify-content-end py-6 px-9">
      <button
        type="button"
        class="btn btn-light btn-active-light-primary me-2"
        [routerLink]="['/companies', companyId, 'pos']"
      >
        {{ "COMMON.BUTTON.CANCEL" | translate }}
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="isSubmitting || isButtonDisabled"
      >
        <span *ngIf="!isSubmitting">
          {{
            (pos ? "COMMON.BUTTON.SAVE" : "COMMON.BUTTON.CREATE") | translate
          }}
        </span>
        <span *ngIf="isSubmitting" class="indicator-progress d-block">
          {{ "COMMON.BUTTON.WAIT" | translate }}
          <span
            class="spinner-border spinner-border-sm align-middle ms-2"
          ></span>
        </span>
      </button>
    </div>
  </form>
</div>
