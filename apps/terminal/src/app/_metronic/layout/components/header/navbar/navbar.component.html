<!--begin::Company Selector-->
<div
  class="app-navbar-item pos-selector-wrapper"
  [ngClass]="itemClass"
  ngbDropdown
  placement="bottom-end"
>
  <div
    class="pos-selector-trigger cursor-pointer d-flex align-items-center justify-content-center"
    ngbDropdownToggle
  >
    <div class="symbol symbol-30px">
      <img
        *ngIf="
          currentCompany?.picture?.baseUrl && currentCompany?.picture?.path
        "
        [src]="
          currentCompany.picture.baseUrl + '/' + currentCompany.picture.path
        "
        alt="Company"
        class="pos-avatar"
      />
      <span
        *ngIf="
          !currentCompany?.picture?.baseUrl || !currentCompany?.picture?.path
        "
        class="symbol-label bg-primary text-white fw-bold fs-7"
      >
        {{ currentCompany?.name?.charAt(0) | uppercase }}
      </span>
    </div>
  </div>
  <div
    ngbDropdownMenu
    class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-800 menu-state-bg menu-state-color fw-semibold py-4 fs-6 w-275px"
  >
    <!--begin::Menu item-->
    <div *ngFor="let account of accounts" class="menu-item px-3">
      <a
        class="menu-link px-3 d-flex align-items-center"
        [class.active]="account.target?.company?.id === currentCompany?.id"
        (click)="selectCompany(account)"
      >
        <div class="symbol symbol-35px symbol-circle me-3">
          <img
            *ngIf="
              account.target?.company?.picture?.baseUrl &&
              account.target?.company?.picture?.path
            "
            [src]="
              account.target.company.picture.baseUrl +
              '/' +
              account.target.company.picture.path
            "
            alt="Company"
          />
          <span
            *ngIf="
              !account.target?.company?.picture?.baseUrl ||
              !account.target?.company?.picture?.path
            "
            class="symbol-label bg-light-primary text-primary fw-bold"
          >
            {{ account.target?.company?.name?.charAt(0) | uppercase }}
          </span>
        </div>
        <span class="text-gray-800">{{ account.target?.company?.name }}</span>
      </a>
    </div>
    <!--end::Menu item-->
  </div>
</div>
<!--begin::Search-->
<div class="app-navbar-item align-items-stretch" [ngClass]="itemClass">
  <!--begin::Notifications-->
  <div class="app-navbar-item" [ngClass]="itemClass">
    <!--begin::Menu- wrapper-->
    <div
      [ngClass]="btnClass"
      data-kt-menu-trigger="{default: 'click', lg: 'hover'}"
      data-kt-menu-attach="parent"
      data-kt-menu-placement="bottom-end"
    >
      <app-keenicon name="notification-status" class="fs-2"></app-keenicon>
    </div>
    <app-notifications-inner></app-notifications-inner>
    <!--end::Menu wrapper-->
  </div>
  <!--end::Notifications-->

  <!--begin::Theme mode-->
  <div class="app-navbar-item" [ngClass]="itemClass">
    <app-theme-mode-switcher
      [toggleBtnClass]="btnClass"
      toggleBtnClass="{`btn-active-light-primary btn-custom ${toolbarButtonHeightClass}`}"
    ></app-theme-mode-switcher>
  </div>
  <!--end::Theme mode-->

  <!--begin::User menu-->
  <div class="app-navbar-item" [ngClass]="itemClass">
    <!--begin::Menu wrapper-->
    <div
      class="cursor-pointer symbol"
      [ngClass]="userAvatarClass"
      data-kt-menu-trigger="{default: 'click'}"
      data-kt-menu-attach="parent"
      data-kt-menu-placement="bottom-end"
    >
      <img
        *ngIf="currentUser?.picture?.baseUrl && currentUser?.picture?.path"
        [src]="currentUser.picture.baseUrl + '/' + currentUser.picture.path"
        alt="User"
      />
      <span
        *ngIf="!currentUser?.picture?.baseUrl || !currentUser?.picture?.path"
        class="symbol-label bg-light-primary text-primary fw-bold fs-6"
      >
        {{ currentUser?.firstName?.charAt(0) | uppercase }}
      </span>
    </div>
    <app-user-inner data-kt-menu="true"></app-user-inner>
    <!--end::Menu wrapper-->
  </div>
  <!--end::User menu-->

  <!--begin::Header menu toggle-->
  <ng-container *ngIf="appHeaderDefaulMenuDisplay">
    <div class="app-navbar-item d-lg-none ms-2 me-n3" title="Show header menu">
      <div
        class="btn btn-icon btn-active-color-primary w-35px h-35px"
        id="kt_app_header_menu_toggle"
      >
        <app-keenicon
          name="element-4"
          class="fs-1"
          [ngClass]="btnIconClass"
        ></app-keenicon>
      </div>
    </div>
  </ng-container>
  <!--end::Header menu toggle-->
</div>
