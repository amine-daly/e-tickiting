<nav class="mobile-footer" aria-label="Mobile navigation">
  <div class="mobile-footer__bar">
    <div class="mobile-footer__side mobile-footer__side--start">
      <button
        *ngFor="let tab of leftTabs"
        type="button"
        class="mobile-footer__tab"
        [class.mobile-footer__tab--active]="isActive(tab.route)"
        (click)="navigate(tab.route)"
      >
        <span class="mobile-footer__tab-icon">
          <app-keenicon [name]="tab.icon" class="fs-2"></app-keenicon>
        </span>
        <span class="mobile-footer__tab-label">{{ tab.label }}</span>
      </button>
    </div>

    <button
      type="button"
      class="mobile-footer__center"
      aria-label="Scan ticket"
      (click)="openScan()"
    >
      <span class="mobile-footer__fab-btn">
        <app-keenicon
          name="scan-barcode"
          type="solid"
          class="fs-2"
        ></app-keenicon>
      </span>
      <span class="mobile-footer__fab-spacer" aria-hidden="true"></span>
      <span class="mobile-footer__tab-label mobile-footer__center-label"
        >Scan</span
      >
    </button>

    <div class="mobile-footer__side mobile-footer__side--end">
      <button
        *ngFor="let tab of rightTabs"
        type="button"
        class="mobile-footer__tab"
        [class.mobile-footer__tab--active]="isActive(tab.route)"
        (click)="navigate(tab.route)"
      >
        <span class="mobile-footer__tab-icon">
          <app-keenicon [name]="tab.icon" class="fs-2"></app-keenicon>
        </span>
        <span class="mobile-footer__tab-label">{{ tab.label }}</span>
      </button>
    </div>
  </div>
</nav>

<!-- Scan Bottom Sheet -->
<app-bottom-sheet
  [open]="scanSheetOpen"
  (close)="closeScanSheet()"
  ariaLabel="Scan ticket"
  [edgeToEdge]="true"
  height="100vh"
>
  <div sheetBody class="bottom-sheet-slot">
    <app-scan-qr-code
      (scanned)="onScanned($event)"
      (closed)="closeScanSheet()"
    ></app-scan-qr-code>
  </div>
</app-bottom-sheet>
