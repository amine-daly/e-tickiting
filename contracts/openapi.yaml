openapi: 3.0.3
info:
  title: E-Ticketing API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /auth/register:
    post:
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
  /users/me:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
  /search/trips:
    get:
      parameters:
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: destination
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        "200":
          description: Trips list
  /tickets/by-reference/{reference}:
    get:
      summary: Find a ticket by QR reference
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reference
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "403":
          description: Ticket exists but the current user cannot access it
        "404":
          description: No ticket matched the provided reference
  /bookings/group/{orderId}/tickets/{ticketId}/cancel:
    post:
      summary: Cancel one passenger from a group booking
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Passenger cancelled and order recalculated
        "404":
          description: Order or ticket not found
        "409":
          description: Order or ticket is not in a cancellable state
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Ticket:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        tripId: { type: string }
        orderId: { type: string, nullable: true }
        seatNo: { type: string, nullable: true }
        status:
          type: string
          enum: [PENDING, CONFIRMED, EXPIRED, CANCELLED]
        expiresAt:
          type: string
          format: date-time
          nullable: true
